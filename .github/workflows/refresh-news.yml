name: Refresh News Feed

# Rebuilds public/news/*.json from real Google News headlines once a day
# (scripts/automation/refresh-news.mjs). Runs on Actions — unlike the
# government portals, Google News serves US traffic normally.

on:
  schedule:
    # 00:40 UTC = 06:10 AM IST, so the morning's feed is fresh
    - cron: '40 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the Pages deploy (see the last step)

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install needed — the script uses only Node's built-ins.
      # It exits non-zero if every search fails, which marks this run as
      # failed and GitHub emails the repo owner.
      - name: Refresh stored news
        run: node scripts/automation/refresh-news.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news
          if git diff --staged --quiet; then
            echo "No news changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "News: daily refresh of stored headlines [skip ci]"
          # The twice-daily exam sync also pushes to main; rebase onto it if it got there first
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "✗ Could not push after 3 attempts."
          exit 1

      # A push made by this workflow's token does not trigger other workflows,
      # so the Pages deploy would never pick up the new files on its own.
      # Starting it explicitly is the one kind of trigger GitHub allows here.
      - name: Publish to the live site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
