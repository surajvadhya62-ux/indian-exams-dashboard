name: Automated Exam Registry Sync

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema Validation Pre-check
        run: npm run validate

      - name: Scan & Verify Official Sources
        run: node scripts/automation/sync-exams.mjs --scan

      - name: Test Build Integrity
        run: npm run build

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/exams.json public/exam-details/
          if git diff --staged --quiet; then
            echo "Registry up to date. No new exams or updates detected."
          else
            git commit -m "Auto-sync: update examination database from official portal scans [skip ci]"
            git push origin main
          fi
