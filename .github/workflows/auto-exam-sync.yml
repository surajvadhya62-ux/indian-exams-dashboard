name: Automated Exam Registry Sync

on:
  schedule:
    # Runs twice daily at off-peak minutes to avoid GitHub Actions queue saturation:
    # 02:20 UTC (07:50 AM IST) & 14:20 UTC (07:50 PM IST)
    - cron: '20 2 * * *'
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema Validation Pre-check
        run: npm run validate

      - name: Scan news feeds for vacancy leads
        run: node scripts/automation/sync-exams.mjs --scan

      - name: Test Build Integrity
        run: npm run build

      - name: Commit review queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Only the review queue is ever committed. Exam data is not machine-writable:
          # a headline is a lead for a human to check, not a source to publish from.
          git add data-sourcing/NEWS-SCAN-QUEUE.md
          if git diff --staged --quiet; then
            echo "No new leads to queue."
          else
            git commit -m "News scan: queue vacancy leads for review [skip ci]"
            git push origin main
          fi

      - name: Intimate Owner of New Exams (Email & Push Alert)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const logPath = "scripts/automation/new-exams-found.json";
            if (fs.existsSync(logPath)) {
              try {
                const exams = JSON.parse(fs.readFileSync(logPath, "utf-8"));
                if (Array.isArray(exams) && exams.length > 0) {
                  const { execSync } = require("child_process");
                  for (const exam of exams) {
                    const title = `🔔 [New Exam Found] ${exam.name} (${exam.acronym || exam.id})`;
                    const body = `### New Examination Detected and Added to IndiaExams\n\n` +
                      `- **Exam Name:** ${exam.name}\n` +
                      `- **Acronym:** ${exam.acronym || "N/A"}\n` +
                      `- **Conducting Authority:** ${exam.conducting_body}\n` +
                      `- **Domain:** ${exam.domain}\n` +
                      `- **Jurisdiction:** ${exam.jurisdiction} (${exam.state})\n` +
                      `- **Entry Level:** ${exam.level}\n` +
                      `- **Application Period:** ${exam.application_period}\n` +
                      `- **Exam Month:** ${exam.exam_month}\n` +
                      `- **Official Portal:** ${exam.website}\n\n` +
                      `*Dossier \`public/exam-details/${exam.id}.json\` has been created, schema-verified, and published to live site.*`;
                    console.log("Creating notification issue for:", exam.name);
                    execSync(`gh issue create --title "${title.replace(/"/g, "\\\"")}" --body "${body.replace(/"/g, "\\\"")}"`, { stdio: "inherit" });
                  }
                  // Clear after intimation
                  fs.writeFileSync(logPath, "[]", "utf-8");
                }
              } catch (e) {
                console.error("Intimation note:", e.message);
              }
            }
          '

      - name: Intimate Owner of Vacancy Leads Awaiting Review
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const logPath = "scripts/automation/exam-updates-found.json";
            if (fs.existsSync(logPath)) {
              try {
                const updates = JSON.parse(fs.readFileSync(logPath, "utf-8"));
                if (Array.isArray(updates) && updates.length > 0) {
                  const { execSync } = require("child_process");
                  for (const u of updates) {
                    const title = `🔎 [Lead to check] ${u.name} (${u.acronym || u.id}) — ${u.vacancies} posts claimed`;
                    const body = `### A news headline mentioned a vacancy figure for this exam\n\n` +
                      `**Exam:** ${u.name} (\`${u.id}\`)\n` +
                      `**Figure claimed:** ${u.vacancies}\n` +
                      `**Headline:** ${u.headline}\n` +
                      `**Link:** ${u.link || "(none captured)"}\n\n` +
                      `**Nothing has been written to the database.** This is a lead, not data. ` +
                      `To act on it, open the conducting body's own notification, confirm the figure ` +
                      `there, and enter it into the dossier with that citation — then clear the row ` +
                      `from \`data-sourcing/NEWS-SCAN-QUEUE.md\`.\n\n` +
                      `Headlines regularly carry figures that look official and are not: expected-vacancy ` +
                      `guesses, all-post totals pinned to a single post, and one state's share of a ` +
                      `national drive have all turned up this way.`;
                    console.log("Creating lead notification for:", u.name);
                    execSync(`gh issue create --title "${title.replace(/"/g, "\\\"")}" --body "${body.replace(/"/g, "\\\"")}"`, { stdio: "inherit" });
                  }
                  // Clear after intimation
                  fs.writeFileSync(logPath, "[]", "utf-8");
                }
              } catch (e) {
                console.error("Update intimation note:", e.message);
              }
            }
          '
