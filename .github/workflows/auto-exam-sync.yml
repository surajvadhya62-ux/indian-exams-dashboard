name: Automated Exam Registry Sync

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema Validation Pre-check
        run: npm run validate

      - name: Scan & Verify Official Sources
        run: node scripts/automation/sync-exams.mjs --scan

      - name: Test Build Integrity
        run: npm run build

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/exams.json public/exam-details/
          if git diff --staged --quiet; then
            echo "Registry up to date. No new exams or updates detected."
          else
            git commit -m "Auto-sync: update examination database from official portal scans [skip ci]"
            git push origin main
          fi

      - name: Intimate Owner of New Exams (Email & Push Alert)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const logPath = "scripts/automation/new-exams-found.json";
            if (fs.existsSync(logPath)) {
              try {
                const exams = JSON.parse(fs.readFileSync(logPath, "utf-8"));
                if (Array.isArray(exams) && exams.length > 0) {
                  const { execSync } = require("child_process");
                  for (const exam of exams) {
                    const title = `🔔 [New Exam Found] ${exam.name} (${exam.acronym || exam.id})`;
                    const body = `### New Examination Detected and Added to IndiaExams\n\n` +
                      `- **Exam Name:** ${exam.name}\n` +
                      `- **Acronym:** ${exam.acronym || "N/A"}\n` +
                      `- **Conducting Authority:** ${exam.conducting_body}\n` +
                      `- **Domain:** ${exam.domain}\n` +
                      `- **Jurisdiction:** ${exam.jurisdiction} (${exam.state})\n` +
                      `- **Entry Level:** ${exam.level}\n` +
                      `- **Application Period:** ${exam.application_period}\n` +
                      `- **Exam Month:** ${exam.exam_month}\n` +
                      `- **Official Portal:** ${exam.website}\n\n` +
                      `*Dossier \`public/exam-details/${exam.id}.json\` has been created, schema-verified, and published to live site.*`;
                    console.log("Creating notification issue for:", exam.name);
                    execSync(`gh issue create --title "${title.replace(/"/g, "\\\"")}" --body "${body.replace(/"/g, "\\\"")}"`, { stdio: "inherit" });
                  }
                  // Clear after intimation
                  fs.writeFileSync(logPath, "[]", "utf-8");
                }
              } catch (e) {
                console.error("Intimation note:", e.message);
              }
            }
          '

      - name: Intimate Owner of Existing Exam Updates
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const logPath = "scripts/automation/exam-updates-found.json";
            if (fs.existsSync(logPath)) {
              try {
                const updates = JSON.parse(fs.readFileSync(logPath, "utf-8"));
                if (Array.isArray(updates) && updates.length > 0) {
                  const { execSync } = require("child_process");
                  for (const u of updates) {
                    const changesDesc = u.changes.map(c => `• **${c.field}**: \`${c.oldValue}\` ➔ \`${c.newValue}\``).join("\n");
                    const title = `🔄 [Exam Updated] ${u.name} (${u.acronym || u.id})`;
                    const body = `### Existing Examination Revised on IndiaExams\n\n` +
                      `**Exam:** ${u.name} (${u.id})\n\n` +
                      `#### Revisions Detected:\n${changesDesc}\n\n` +
                      `*Updated in database and reflected across the Annual Calendar and Search Views.*`;
                    console.log("Creating update notification for:", u.name);
                    execSync(`gh issue create --title "${title.replace(/"/g, "\\\"")}" --body "${body.replace(/"/g, "\\\"")}"`, { stdio: "inherit" });
                  }
                  // Clear after intimation
                  fs.writeFileSync(logPath, "[]", "utf-8");
                }
              } catch (e) {
                console.error("Update intimation note:", e.message);
              }
            }
          '
