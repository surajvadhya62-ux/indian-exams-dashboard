name: Automated Exam Registry Sync

on:
  schedule:
    # Runs every Monday at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema Validation
        run: npm run validate

      - name: Scan & Verify Official Sources
        run: node scripts/automation/sync-exams.mjs --scan

      - name: Test Build Integrity
        run: npm run build
